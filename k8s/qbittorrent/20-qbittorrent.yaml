apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      containers:
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:4.6.7
          env:
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "100" }
            - { name: TZ, value: "Europe/Madrid" }
            - { name: WEBUI_PORT, value: "8080" }
          ports:
            - { name: webui, containerPort: 8080 }
            - { name: torrent-tcp, containerPort: 6881, protocol: TCP }
            - { name: torrent-udp, containerPort: 6881, protocol: UDP }
          volumeMounts:
            - { name: config, mountPath: /config }
            # Same PVC as radarr/sonarr/jellyfin: downloads land in
            # /media/downloads so the *arr apps can hardlink into
            # movies/ and shows/ instead of copying across volumes.
            - { name: media, mountPath: /media }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet: { path: /, port: webui }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: webui }
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: media
          persistentVolumeClaim:
            claimName: jellyfin-media
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: media
spec:
  type: LoadBalancer
  selector:
    app: qbittorrent
  ports:
    - { name: webui, port: 8080, targetPort: webui }
    - { name: torrent-tcp, port: 6881, targetPort: torrent-tcp, protocol: TCP }
    - { name: torrent-udp, port: 6881, targetPort: torrent-udp, protocol: UDP }
