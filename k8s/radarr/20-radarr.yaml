apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
    spec:
      containers:
        - name: radarr
          image: lscr.io/linuxserver/radarr:5.14.0
          # linuxserver's s6-overlay entrypoint runs as root to chown to
          # PUID/PGID before dropping privileges, so it can't be forced
          # non-root like the jellyfin/navidrome images.
          env:
            - { name: PUID, value: "1000" }
            - { name: PGID, value: "100" }
            - { name: TZ, value: "Europe/Madrid" }
          ports:
            - name: http
              containerPort: 7878
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: media, mountPath: /media }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: radarr-config
        # Shared with jellyfin and sonarr so moves into movies/ and
        # downloads/ land on the same filesystem and can be hardlinked.
        - name: media
          persistentVolumeClaim:
            claimName: jellyfin-media
---
apiVersion: v1
kind: Service
metadata:
  name: radarr
  namespace: media
spec:
  type: LoadBalancer
  selector:
    app: radarr
  ports:
    - name: http
      port: 7878
      targetPort: http
